name: Update DLR wait data

on:
  push:
    paths:
      - 'dlr-waits/index.html'
      - '.github/workflows/update-dlr-waits.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live Disneyland Resort data
        run: |
          set -euo pipefail
          mkdir -p dlr-waits
          curl -fsSL --retry 3 'https://api.themeparks.wiki/v1/entity/7340550b-c14d-4def-80bb-acdb51d49a66/live' -o /tmp/dl.json
          curl -fsSL --retry 3 'https://api.themeparks.wiki/v1/entity/832fcd51-ea19-4e77-85c7-75d5843b127c/live' -o /tmp/dca.json
          jq -n --slurpfile dl /tmp/dl.json --slurpfile dca /tmp/dca.json \
            '{generatedAt:(now|todateiso8601),dl:$dl[0],dca:$dca[0]}' > dlr-waits/data.json
      - name: Commit fresh data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dlr-waits/data.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update Disneyland wait data'
          git push
